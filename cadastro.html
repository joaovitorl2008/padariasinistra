
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Funcionários</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Padaria Sinistríssima</h1>
        <p>Cadastro de Funcionários</p>
    </header>

    <main class="cadastro">

        <h2>Cadastrar Funcionário</h2>
        <p>Preencha todos os campos abaixo:</p>

        <form id="formCadastro" novalidate>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf"
            placeholder="000.000.000-00"
            maxlength="14"
            inputmode="numeric"
            required>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone"
            placeholder="(00) 00000-0000"
            maxlength="15"
            inputmode="numeric"
            required>

            <label for="email">E-mail:</label>
            <input type="email" id="email"
            placeholder="Ex: joao@email.com"
            required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco"
            placeholder="Rua, número e bairro"
            required>

            <label for="cargo">Cargo:</label>
            <select id="cargo" required>
                <option value="">Escolha o cargo</option>
                <option>Padeiro</option>
                <option>Confeiteiro</option>
                <option>Operador de Caixa</option>
                <option>Atendente</option>
                <option>Auxiliar de Produção</option>
                <option>Auxiliar de Limpeza</option>
                <option>Gerente</option>
                <option>Entregador</option>
                <option>Estoquista</option>
                <option>Cozinheiro</option>
                <option>Garçom</option>
                <option>Administrador</option>
            </select>

            <label for="salario">Salário (R$):</label>
            <input type="number" id="salario"
            placeholder="Ex: 1800.00"
            min="0.01"
            step="0.01"
            required>

            <label for="contratacao">Data de contratação:</label>
            <input type="date" id="contratacao" required>

            <div class="botoes">
                <button type="submit">Cadastrar Funcionário</button>
                <button type="reset">Limpar Campos</button>
            </div>

            <div id="mensagem"></div>

        </form>

        <a class="voltar" href="index.html">
            Voltar para o início
        </a>

    </main>

    <footer>
        <p>© 2026 - Padaria Sinistríssima</p>
        <p>O sabor é sinistro de tão bom!</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
